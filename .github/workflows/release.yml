name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: vX.Y.Z (e.g., v1.0.0)"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - name: Check if version exists
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "⚠️  Tag $VERSION already exists"
          else
            echo "✅ Tag $VERSION is new"
          fi

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: public/
          retention-days: 7

  create-version:
    name: Create Versioned Documentation
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create versioned documentation
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VERSION_DIR="docs/versions/${VERSION}"

          # Skip if version directory already exists
          if [ -d "$VERSION_DIR" ]; then
            echo "Version directory $VERSION_DIR already exists"
            exit 0
          fi

          # Copy vNEXT to versioned directory
          if [ -d "docs/versions/vNEXT" ]; then
            cp -r docs/versions/vNEXT "$VERSION_DIR"
            echo "✅ Created $VERSION_DIR from vNEXT"
          else
            echo "⚠️  No vNEXT directory found, skipping versioned docs creation"
            exit 0
          fi

          # Update versions.json
          if [ -f "docs/versions.json" ]; then
            node -e "
              const fs = require('fs');
              const versions = JSON.parse(fs.readFileSync('docs/versions.json', 'utf8'));
              const version = process.env.VERSION;
              const date = new Date().toISOString().split('T')[0];

              // Add new version
              versions.versions.unshift({
                name: version,
                released: date,
                status: 'stable'
              });

              // Update latest pointer
              versions.latest = version;

              // Mark vNEXT if exists
              const vnextIndex = versions.versions.findIndex(v => v.name === 'vNEXT');
              if (vnextIndex !== -1) {
                versions.versions[vnextIndex].status = 'development';
              }

              fs.writeFileSync('docs/versions.json', JSON.stringify(versions, null, 2) + '\n');
              console.log('Updated versions.json');
            " VERSION="${VERSION}"
          fi

          # Create symlink for latest
          cd docs/versions
          rm -f latest
          ln -s "${VERSION}" latest
          cd ../..

          # Commit changes
          git add docs/versions/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: version $VERSION

          - Created versioned documentation at ${VERSION_DIR}
          - Updated versions.json manifest
          - Updated latest symlink

          Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>"
            git push origin HEAD:main
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build, create-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: public/

      - name: Create release archive
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          tar -czf "docs-${VERSION}.tar.gz" public/
          sha256sum "docs-${VERSION}.tar.gz" > "docs-${VERSION}.tar.gz.sha256"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release, no previous tag"
            CHANGELOG="## What's New\n\nInitial release of the documentation hub."
          else
            echo "Generating changelog from $PREVIOUS_TAG to $VERSION"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
          fi

          # Save to file for release notes
          cat > release-notes.md << EOF
          ## Documentation Hub Release ${VERSION}

          ### Changes

          ${CHANGELOG}

          ### Installation

          Download and extract the site build:

          \`\`\`bash
          wget https://github.com/raibid-labs/docs/releases/download/${VERSION}/docs-${VERSION}.tar.gz
          tar -xzf docs-${VERSION}.tar.gz
          \`\`\`

          ### Verification

          Verify the download:

          \`\`\`bash
          sha256sum -c docs-${VERSION}.tar.gz.sha256
          \`\`\`

          ### Live Site

          The documentation is deployed at: https://raibid-labs.github.io/docs

          ### Versioned Documentation

          This release includes versioned documentation at \`docs/versions/${VERSION}/\`

          ---

          **Generated with** [Claude Code](https://claude.com/claude-code)
          EOF

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            docs-${{ needs.validate.outputs.version }}.tar.gz
            docs-${{ needs.validate.outputs.version }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    name: Update README with Release Info
    runs-on: ubuntu-latest
    needs: [validate, release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update README badge
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Check if README has a version badge section, if not skip
          if ! grep -q "Last deployed" README.md; then
            echo "No version info section in README, skipping"
            exit 0
          fi

          echo "✅ Release $VERSION completed"

      - name: Create summary
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/raibid-labs/docs/releases/tag/$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Site**: https://raibid-labs.github.io/docs" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned Docs**: docs/versions/$VERSION/" >> $GITHUB_STEP_SUMMARY
