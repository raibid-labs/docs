[workspace]
members = [
    "crates/scarab-nav-protocol",
    "crates/scarab-nav-client",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Scarab Team"]

[workspace.dependencies]
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
ratatui = { version = "0.29", default-features = false } 
# We support ratatui integration but don't force a version if possible, 
# but for the client helper we might need it. 
