[package]
name = "scarab-nav-protocol"
version = "0.2.0"
edition = "2021"
authors = ["Scarab Team"]
license = "MIT"
description = "Protocol definitions for Scarab Navigation System - enabling keyboard-driven navigation for TUI applications"
repository = "https://github.com/raibid-labs/scarab-nav"
homepage = "https://github.com/raibid-labs/scarab-nav"
documentation = "https://docs.rs/scarab-nav-protocol"
readme = "../../README.md"
keywords = ["tui", "navigation", "terminal", "keyboard", "accessibility"]
categories = ["command-line-interface", "gui", "accessibility"]

[dependencies]
prost = "0.12"

[build-dependencies]
prost-build = "0.12"
