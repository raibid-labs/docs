# Lychee link checker configuration

# Maximum number of concurrent requests
max_concurrency = 10

# Exclude these URLs from checking
exclude = [
    # Localhost and example URLs
    'http://localhost:*',
    'http://127.0.0.1:*',
    'https://example.com',

    # Social media platforms that block automated requests
    'https://twitter.com/*',
    'https://x.com/*',
    'https://linkedin.com/*',

    # URLs that require authentication
    'https://github.com/settings/*',
]

# Exclude these path patterns
exclude_path = [
    'node_modules',
    'public',
    '.git',
    'quartz',
    '.quartz-cache',
]

# Accept these HTTP status codes as valid
accept = [200, 201, 202, 203, 204, 301, 302, 307, 308, 429]

# Timeout for requests (in seconds)
timeout = 30

# Number of retries
max_retries = 3

# User agent string
user_agent = "Mozilla/5.0 (compatible; Lychee/0.15.0; +https://github.com/lycheeverse/lychee)"

# Check for fragments in URLs
include_fragments = false

# Skip checking for mail addresses
exclude_mail = true
